services:
  # ==========================================================
  # SERVICE 1 : MODULE DE CONNEXION (LANCEMENT MANUEL)
  # docker compose run --rm -p 9222:9222 service1-login
  # ==========================================================
  service1-login:
    image: ghcr.io/hoesaek/epic-games-claimer-service1:latest
    container_name: epic-login
    environment:
      - SESSION_SECRET_KEY=EpicGamesSuperSecretKey12345678!
      - TZ=Europe/Paris
    volumes:
      - session_data:/app/shared
    ports:
      - "9222:9222"

  # ==========================================================
  # SERVICE 2 : DÉMON DE RÉCUPÉRATION (BACKGROUND SERVER)
  # ==========================================================
  service2-daemon:
    image: ghcr.io/hoesaek/epic-games-claimer-service2:latest
    container_name: epic-daemon
    restart: unless-stopped
    environment:
      - SESSION_SECRET_KEY=EpicGamesSuperSecretKey12345678!
      - TZ=Europe/Paris
    ports:
      - "8080:8080"
    volumes:
      - session_data:/app/shared

volumes:
  session_data:
